<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử Cảnh báo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-dark text-light">

    <nav class="navbar navbar-expand-lg navbar-dark bg-secondary">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">🚗 Driver Monitor AI</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/"><i class="bi bi-display"></i> Giám sát</a>
                <a class="nav-link active" href="/history.html"><i class="bi bi-clock-history"></i> Lịch sử</a>
                <a class="nav-link" href="/settings.html"><i class="bi bi-gear-fill"></i> Cài đặt</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="mb-0">Lịch sử Cảnh báo</h2>
            <div class="d-flex gap-2 align-items-center">
                <span class="text-muted small" id="last-update">--</span>
                <button class="btn btn-sm btn-outline-danger" onclick="clearHistory()">
                    <i class="bi bi-trash"></i> Xóa lịch sử
                </button>
            </div>
        </div>

        <div class="card bg-secondary text-light">
            <div class="card-body p-0">
                <table class="table table-dark table-striped table-hover mb-0">
                    <thead>
                        <tr>
                            <th style="width:50px">#</th>
                            <th>Thời gian</th>
                            <th>Loại cảnh báo</th>
                            <th>Mức độ</th>
                        </tr>
                    </thead>
                    <tbody id="history-tbody">
                        <tr>
                            <td colspan="4" class="text-center text-muted py-4">
                                <i class="bi bi-hourglass-split"></i> Đang tải...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
